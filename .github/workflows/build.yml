name: Build & Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run test:ai
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          PLAYWRIGHT_PREVIEW: '1'

  package-windows-portable:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package Windows portable
        run: npm run dist:win
      - name: Inspect application archive
        run: node scripts/verify-package.cjs
      - name: Upload Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: NPI-Builder-Windows-Portable
          path: release/NPI-Document-Builder-Portable-*.exe
          retention-days: 14
          if-no-files-found: error
